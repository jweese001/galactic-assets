<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Layered Planet Shader V2 - Demo</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            border-bottom: 2px solid #007acc;
            padding-bottom: 10px;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 30, 30, 0.8);
            border-radius: 6px;
            border-left: 3px solid #007acc;
        }
        .section h2 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #b0b0b0;
            font-weight: 500;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #007acc;
            border-radius: 50%;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #007acc;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        input[type="color"] {
            width: 100%;
            height: 32px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #1a1a1a;
            cursor: pointer;
        }
        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            cursor: pointer;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #e0e0e0;
            cursor: pointer;
            padding: 6px 0;
        }
        .value-display {
            display: inline-block;
            float: right;
            color: #007acc;
            font-weight: 600;
            font-size: 11px;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #005a9e;
        }
        .preset-button {
            background: #2a2a2a;
            margin-top: 5px;
        }
        .preset-button:hover {
            background: #3a3a3a;
        }
        .info {
            font-size: 11px;
            color: #808080;
            margin-top: 4px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h1>Enhanced Planet Shader V2</h1>

        <div class="section">
            <h2>🌍 Terrain</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="terrain-enabled" checked>
                Enable Terrain Layer
            </label>
            <div class="control-group">
                <label>Scale <span class="value-display" id="terrain-scale-val">3.0</span></label>
                <input type="range" id="terrain-scale" min="1" max="10" step="0.1" value="3">
            </div>
            <div class="control-group">
                <label>Roughness <span class="value-display" id="terrain-roughness-val">0.5</span></label>
                <input type="range" id="terrain-roughness" min="0" max="1" step="0.05" value="0.5">
                <div class="info">Controls continental shapes vs. detailed features</div>
            </div>
            <div class="control-group">
                <label>Biome Variation <span class="value-display" id="biome-variation-val">0.7</span></label>
                <input type="range" id="biome-variation" min="0" max="1" step="0.05" value="0.7">
                <div class="info">Desert/forest/grassland color diversity</div>
            </div>
            <div class="control-group">
                <label>Mountain Color</label>
                <input type="color" id="mountain-color" value="#8b7355">
            </div>
            <div class="control-group">
                <label>Lowland Color</label>
                <input type="color" id="lowland-color" value="#4a7c59">
            </div>
            <div class="control-group">
                <label>Desert Color</label>
                <input type="color" id="desert-color" value="#c19a6b">
            </div>
        </div>

        <div class="section">
            <h2>🌊 Water</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="water-enabled" checked>
                Enable Water Layer
            </label>
            <div class="control-group">
                <label>Coverage <span class="value-display" id="water-coverage-val">0.6</span></label>
                <input type="range" id="water-coverage" min="0" max="1" step="0.05" value="0.6">
            </div>
            <div class="control-group">
                <label>Animation Speed <span class="value-display" id="water-speed-val">0.3</span></label>
                <input type="range" id="water-speed" min="0" max="2" step="0.1" value="0.3">
                <div class="info">Wave and current animation rate</div>
            </div>
            <div class="control-group">
                <label>Wave Intensity <span class="value-display" id="wave-intensity-val">0.4</span></label>
                <input type="range" id="wave-intensity" min="0" max="1" step="0.05" value="0.4">
            </div>
            <div class="control-group">
                <label>Specular Strength <span class="value-display" id="water-specular-val">0.8</span></label>
                <input type="range" id="water-specular" min="0" max="1" step="0.05" value="0.8">
                <div class="info">Sun reflection on water surface</div>
            </div>
            <div class="control-group">
                <label>Color</label>
                <input type="color" id="water-color" value="#1e5a8e">
            </div>
        </div>

        <div class="section">
            <h2>❄️ Ice Caps</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="ice-enabled" checked>
                Enable Ice Caps
            </label>
            <div class="control-group">
                <label>Size <span class="value-display" id="ice-size-val">0.25</span></label>
                <input type="range" id="ice-size" min="0" max="0.5" step="0.05" value="0.25">
            </div>
            <div class="control-group">
                <label>Roughness <span class="value-display" id="ice-roughness-val">0.3</span></label>
                <input type="range" id="ice-roughness" min="0" max="1" step="0.05" value="0.3">
            </div>
            <div class="control-group">
                <label>Color</label>
                <input type="color" id="ice-color" value="#e8f4f8">
            </div>
        </div>

        <div class="section">
            <h2>☁️ Clouds</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="clouds-enabled" checked>
                Enable Cloud Layer
            </label>
            <div class="control-group">
                <label>Coverage <span class="value-display" id="cloud-coverage-val">0.5</span></label>
                <input type="range" id="cloud-coverage" min="0" max="1" step="0.05" value="0.5">
            </div>
            <div class="control-group">
                <label>Animation Speed <span class="value-display" id="cloud-speed-val">0.15</span></label>
                <input type="range" id="cloud-speed" min="0" max="1" step="0.05" value="0.15">
            </div>
            <div class="control-group">
                <label>Noise Type</label>
                <select id="cloud-noise-type">
                    <option value="0">Smooth Cirrus</option>
                    <option value="1" selected>Fluffy Cumulus</option>
                    <option value="2">Storm Cells</option>
                    <option value="3">Weather Fronts</option>
                </select>
            </div>
            <div class="control-group">
                <label>Depth (3D) <span class="value-display" id="cloud-depth-val">0.6</span></label>
                <input type="range" id="cloud-depth" min="0" max="1" step="0.05" value="0.6">
                <div class="info">Cloud layer thickness and shadows</div>
            </div>
            <div class="control-group">
                <label>Shadow Intensity <span class="value-display" id="cloud-shadow-val">0.4</span></label>
                <input type="range" id="cloud-shadow" min="0" max="1" step="0.05" value="0.4">
            </div>
        </div>

        <div class="section">
            <h2>🌫️ Atmosphere</h2>
            <label class="checkbox-label">
                <input type="checkbox" id="atmosphere-enabled" checked>
                Enable Atmosphere Glow
            </label>
            <div class="control-group">
                <label>Density <span class="value-display" id="atmosphere-density-val">0.5</span></label>
                <input type="range" id="atmosphere-density" min="0" max="1" step="0.05" value="0.5">
            </div>
            <div class="control-group">
                <label>Color</label>
                <input type="color" id="atmosphere-color" value="#87ceeb">
            </div>
        </div>

        <div class="section">
            <h2>🎨 Presets</h2>
            <button class="preset-button" onclick="loadPreset('earth')">Earth-like</button>
            <button class="preset-button" onclick="loadPreset('mars')">Mars</button>
            <button class="preset-button" onclick="loadPreset('ocean')">Ocean World</button>
            <button class="preset-button" onclick="loadPreset('frozen')">Frozen Planet</button>
            <button class="preset-button" onclick="loadPreset('desert')">Desert World</button>
            <button class="preset-button" onclick="loadPreset('alien')">Alien Biosphere</button>
        </div>

        <button onclick="randomizePlanet()">Randomize Planet</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        camera.position.z = 3;

        // Lighting
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        // Enhanced Shader
        const vertexShader = `
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec2 vUv;
            varying vec3 vViewPosition;

            void main() {
                vNormal = normalize(normalMatrix * normal);
                vPosition = position;
                vUv = uv;

                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vViewPosition = -mvPosition.xyz;

                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform float u_time;
            uniform vec3 u_lightPosition;

            // Layer toggles
            uniform bool u_terrainEnabled;
            uniform bool u_waterEnabled;
            uniform bool u_iceEnabled;
            uniform bool u_cloudsEnabled;
            uniform bool u_atmosphereEnabled;

            // Terrain
            uniform float u_terrainScale;
            uniform float u_terrainRoughness;
            uniform float u_biomeVariation;
            uniform vec3 u_mountainColor;
            uniform vec3 u_lowlandColor;
            uniform vec3 u_desertColor;

            // Water
            uniform float u_waterCoverage;
            uniform float u_waterSpeed;
            uniform float u_waveIntensity;
            uniform float u_waterSpecular;
            uniform vec3 u_waterColor;

            // Ice
            uniform float u_iceSize;
            uniform float u_iceRoughness;
            uniform vec3 u_iceColor;

            // Clouds
            uniform float u_cloudCoverage;
            uniform float u_cloudSpeed;
            uniform float u_cloudNoiseType;
            uniform float u_cloudDepth;
            uniform float u_cloudShadow;

            // Atmosphere
            uniform float u_atmosphereDensity;
            uniform vec3 u_atmosphereColor;

            varying vec3 vNormal;
            varying vec3 vPosition;
            varying vec2 vUv;
            varying vec3 vViewPosition;

            // 3D Simplex Noise
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);

                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);

                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;

                i = mod289(i);
                vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0));

                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;

                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);

                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);

                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);

                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));

                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);

                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;

                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }

            // Fractal Brownian Motion
            float fbm(vec3 p, int octaves, float roughness) {
                float value = 0.0;
                float amplitude = 1.0;
                float frequency = 1.0;
                float maxValue = 0.0;

                for(int i = 0; i < 8; i++) {
                    if(i >= octaves) break;
                    value += amplitude * snoise(p * frequency);
                    maxValue += amplitude;
                    amplitude *= roughness;
                    frequency *= 2.0;
                }

                return value / maxValue;
            }

            // Terrain elevation with continental shapes
            float terrainNoise(vec3 p) {
                // Large-scale continents (low frequency)
                float continents = fbm(p * 0.8, 2, 0.5);

                // Medium-scale regional features
                float regions = fbm(p * u_terrainScale * 0.5, 3, u_terrainRoughness);

                // Fine-scale details (mountains, valleys)
                float details = fbm(p * u_terrainScale * 2.0, 4, u_terrainRoughness);

                // Combine scales with appropriate weights
                float elevation = continents * 0.6 + regions * 0.3 + details * 0.1;

                return elevation;
            }

            // Biome determination based on latitude, elevation, and regional variation
            vec3 getBiomeColor(vec3 basePos, float elevation, float latitude) {
                // Regional climate variation
                float regionalNoise = fbm(basePos * 1.5, 2, 0.6);

                // Latitude factor (0 at equator, 1 at poles)
                float latitudeFactor = abs(latitude);

                // Temperature decreases with latitude and elevation
                float temperature = 1.0 - latitudeFactor * 0.7 - elevation * 0.3 + regionalNoise * 0.2;

                // Moisture varies regionally
                float moisture = fbm(basePos * 2.0 + vec3(100.0), 2, 0.5) * 0.5 + 0.5;

                vec3 biomeColor;

                // High elevation = mountains (rocky, brown)
                if(elevation > 0.3) {
                    float mountainVariation = fbm(basePos * 5.0, 2, 0.5) * 0.3;
                    biomeColor = mix(u_mountainColor, u_mountainColor * 0.7, mountainVariation);
                }
                // Cold = tundra/taiga
                else if(temperature < 0.3) {
                    biomeColor = mix(vec3(0.6, 0.65, 0.6), vec3(0.4, 0.5, 0.4), moisture);
                }
                // Hot and dry = desert
                else if(temperature > 0.7 && moisture < 0.4) {
                    float desertVariation = fbm(basePos * 4.0, 2, 0.5) * 0.2;
                    biomeColor = u_desertColor + vec3(desertVariation);
                }
                // Wet = forest/jungle
                else if(moisture > 0.6) {
                    float forestShade = fbm(basePos * 6.0, 2, 0.5) * 0.3;
                    biomeColor = mix(u_lowlandColor, u_lowlandColor * 0.6, forestShade);
                }
                // Default = grassland/plains
                else {
                    float grassVariation = fbm(basePos * 3.0, 2, 0.5) * 0.2;
                    biomeColor = mix(u_lowlandColor * 1.2, u_lowlandColor * 0.9, grassVariation);
                }

                // Apply biome variation strength
                biomeColor = mix(u_lowlandColor, biomeColor, u_biomeVariation);

                return biomeColor;
            }

            // Enhanced water with waves and foam
            vec3 getWaterColor(vec3 basePos, float elevation, vec3 normal) {
                // Animated wave pattern
                float waveTime = u_time * u_waterSpeed;
                vec3 wavePos = basePos * 8.0 + vec3(waveTime * 0.5, waveTime * 0.3, 0.0);
                float waves = fbm(wavePos, 3, 0.5) * u_waveIntensity;

                // Water surface variation
                vec3 waterColor = u_waterColor;

                // Darker water in deep areas
                if(elevation < -0.2) {
                    waterColor *= 0.7;
                }

                // Foam near coastlines (where elevation is near water threshold)
                float coastalFactor = smoothstep(0.45, 0.5, elevation);
                float foam = fbm(basePos * 15.0 + vec3(waveTime), 2, 0.5);
                foam = pow(max(0.0, foam), 2.0) * coastalFactor;
                waterColor = mix(waterColor, vec3(0.9, 0.95, 1.0), foam * 0.5);

                // Add wave highlights
                waterColor += vec3(waves * 0.1);

                return waterColor;
            }

            // Multiple cloud noise types
            float getCloudNoise(vec3 p, float noiseType) {
                float animTime = u_time * u_cloudSpeed;
                vec3 animPos = p + vec3(animTime * 0.2, animTime * 0.1, 0.0);

                // Type 0: Smooth cirrus
                if(noiseType < 0.5) {
                    return fbm(animPos * 3.0, 2, 0.4);
                }
                // Type 1: Fluffy cumulus
                else if(noiseType < 1.5) {
                    float base = fbm(animPos * 2.5, 3, 0.6);
                    float detail = fbm(animPos * 8.0, 2, 0.5);
                    return pow(max(0.0, base), 1.5) + detail * 0.2;
                }
                // Type 2: Storm cells
                else if(noiseType < 2.5) {
                    float cells = fbm(animPos * 1.8, 2, 0.7);
                    float turbulence = fbm(animPos * 6.0, 3, 0.6);
                    return pow(max(0.0, cells), 2.0) + turbulence * 0.3;
                }
                // Type 3: Weather fronts
                else {
                    float fronts = fbm(animPos * vec3(4.0, 2.0, 4.0), 2, 0.5);
                    float swirls = fbm(animPos * 3.5 + vec3(0.0, animTime * 0.3, 0.0), 2, 0.6);
                    return fronts * 0.7 + swirls * 0.4;
                }
            }

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 lightDir = normalize(u_lightPosition - vPosition);
                vec3 viewDir = normalize(vViewPosition);

                // Latitude for biome determination
                float latitude = vPosition.y / length(vPosition);

                // Base color starts as black
                vec3 finalColor = vec3(0.0);
                float alpha = 1.0;

                // === TERRAIN LAYER ===
                float elevation = 0.0;
                if(u_terrainEnabled) {
                    elevation = terrainNoise(vPosition);
                    vec3 terrainColor = getBiomeColor(vPosition, elevation, latitude);

                    // Basic lighting
                    float diffuse = max(0.0, dot(normal, lightDir));
                    terrainColor *= (0.4 + diffuse * 0.6);

                    finalColor = terrainColor;
                }

                // === WATER LAYER ===
                if(u_waterEnabled && elevation < (u_waterCoverage - 0.5)) {
                    vec3 waterColor = getWaterColor(vPosition, elevation, normal);

                    // Water lighting
                    float diffuse = max(0.0, dot(normal, lightDir));
                    waterColor *= (0.5 + diffuse * 0.5);

                    // Specular highlights (sun reflection)
                    vec3 halfVector = normalize(lightDir + viewDir);
                    float specular = pow(max(0.0, dot(normal, halfVector)), 32.0);
                    waterColor += vec3(specular * u_waterSpecular);

                    finalColor = waterColor;
                }

                // === ICE CAPS LAYER ===
                if(u_iceEnabled) {
                    float iceThreshold = 1.0 - u_iceSize;
                    float iceFactor = smoothstep(iceThreshold - 0.1, iceThreshold, abs(latitude));

                    if(iceFactor > 0.01) {
                        // Ice texture
                        float iceNoise = fbm(vPosition * 8.0, 3, u_iceRoughness);
                        vec3 iceColor = u_iceColor + vec3(iceNoise * 0.1);

                        // Ice lighting
                        float diffuse = max(0.0, dot(normal, lightDir));
                        iceColor *= (0.6 + diffuse * 0.4);

                        // Ice specular (shiny ice)
                        vec3 halfVector = normalize(lightDir + viewDir);
                        float specular = pow(max(0.0, dot(normal, halfVector)), 16.0);
                        iceColor += vec3(specular * 0.3);

                        finalColor = mix(finalColor, iceColor, iceFactor);
                    }
                }

                // === CLOUD LAYER WITH SHADOWS ===
                float cloudMask = 0.0;
                if(u_cloudsEnabled) {
                    float cloudNoise = getCloudNoise(vPosition, u_cloudNoiseType);

                    // BIAS APPROACH: Shift noise distribution for predictable coverage
                    // Gentler bias to preserve low-coverage clouds
                    // Map coverage [0, 1] to bias [-0.5, 0.5]
                    float bias = (u_cloudCoverage - 0.5) * 1.0;
                    cloudNoise = clamp(cloudNoise + bias, 0.0, 1.0);

                    // Wider smoothstep to preserve cloud detail and complexity
                    cloudMask = smoothstep(0.35, 0.65, cloudNoise);

                    if(cloudMask > 0.01) {
                        // Cloud color with depth
                        vec3 cloudColor = vec3(1.0);
                        float cloudLighting = max(0.3, dot(normal, lightDir));

                        // 3D depth effect - clouds are thicker and darker at center
                        float cloudThickness = cloudMask * u_cloudDepth;
                        cloudColor *= mix(1.0, 0.7, cloudThickness);
                        cloudColor *= cloudLighting;

                        // Blend clouds over surface
                        finalColor = mix(finalColor, cloudColor, cloudMask * 0.9);
                    }

                    // Cloud shadows on surface below
                    if(u_cloudShadow > 0.0) {
                        // Sample clouds slightly offset (simulate sun angle)
                        vec3 shadowSamplePos = vPosition + lightDir * 0.15;
                        float shadowCloudNoise = getCloudNoise(shadowSamplePos, u_cloudNoiseType);

                        // Apply same bias approach for consistent shadow coverage
                        float bias = (u_cloudCoverage - 0.5) * 1.0;
                        shadowCloudNoise = clamp(shadowCloudNoise + bias, 0.0, 1.0);
                        float shadowMask = smoothstep(0.35, 0.65, shadowCloudNoise);

                        // Darken surface where clouds cast shadows
                        finalColor *= mix(1.0, 0.6, shadowMask * u_cloudShadow * (1.0 - cloudMask));
                    }
                }

                // === ATMOSPHERE LAYER ===
                if(u_atmosphereEnabled && u_atmosphereDensity > 0.0) {
                    // Fresnel effect
                    float fresnel = pow(1.0 - abs(dot(viewDir, normal)), 3.0);
                    vec3 atmosphereGlow = u_atmosphereColor * fresnel * u_atmosphereDensity;

                    // Atmospheric scattering affects whole planet
                    vec3 scattering = u_atmosphereColor * u_atmosphereDensity * 0.1;
                    finalColor += scattering;

                    // Add glow at edges
                    finalColor += atmosphereGlow * 0.5;
                }

                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        // Create planet
        console.log('🌍 V2 Demo - Cloud coverage v4: Slider remapped [0,1] → [0.5,1.0]');
        const geometry = new THREE.SphereGeometry(1, 128, 128);
        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
                u_time: { value: 0.0 },
                u_lightPosition: { value: new THREE.Vector3(5, 3, 5) },

                u_terrainEnabled: { value: true },
                u_waterEnabled: { value: true },
                u_iceEnabled: { value: true },
                u_cloudsEnabled: { value: true },
                u_atmosphereEnabled: { value: true },

                u_terrainScale: { value: 3.0 },
                u_terrainRoughness: { value: 0.5 },
                u_biomeVariation: { value: 0.7 },
                u_mountainColor: { value: new THREE.Color(0x8b7355) },
                u_lowlandColor: { value: new THREE.Color(0x4a7c59) },
                u_desertColor: { value: new THREE.Color(0xc19a6b) },

                u_waterCoverage: { value: 0.6 },
                u_waterSpeed: { value: 0.3 },
                u_waveIntensity: { value: 0.4 },
                u_waterSpecular: { value: 0.8 },
                u_waterColor: { value: new THREE.Color(0x1e5a8e) },

                u_iceSize: { value: 0.25 },
                u_iceRoughness: { value: 0.3 },
                u_iceColor: { value: new THREE.Color(0xe8f4f8) },

                u_cloudCoverage: { value: 0.75 }, // Remapped from slider 0.5 (0.5 + 0.5*0.5)
                u_cloudSpeed: { value: 0.15 },
                u_cloudNoiseType: { value: 1.0 },
                u_cloudDepth: { value: 0.6 },
                u_cloudShadow: { value: 0.4 },

                u_atmosphereDensity: { value: 0.5 },
                u_atmosphereColor: { value: new THREE.Color(0x87ceeb) }
            }
        });

        const planet = new THREE.Mesh(geometry, material);
        scene.add(planet);

        // Controls setup
        function setupControl(id, uniformName, isColor = false) {
            const element = document.getElementById(id);
            const valueDisplay = document.getElementById(id + '-val');

            if(isColor) {
                element.addEventListener('input', (e) => {
                    material.uniforms[uniformName].value.set(e.target.value);
                });
            } else {
                element.addEventListener('input', (e) => {
                    const value = parseFloat(e.target.value);
                    material.uniforms[uniformName].value = value;
                    if(valueDisplay) {
                        valueDisplay.textContent = value.toFixed(2);
                    }
                });
            }
        }

        function setupToggle(id, uniformName) {
            const element = document.getElementById(id);
            element.addEventListener('change', (e) => {
                material.uniforms[uniformName].value = e.target.checked;
            });
        }

        // Terrain
        setupToggle('terrain-enabled', 'u_terrainEnabled');
        setupControl('terrain-scale', 'u_terrainScale');
        setupControl('terrain-roughness', 'u_terrainRoughness');
        setupControl('biome-variation', 'u_biomeVariation');
        setupControl('mountain-color', 'u_mountainColor', true);
        setupControl('lowland-color', 'u_lowlandColor', true);
        setupControl('desert-color', 'u_desertColor', true);

        // Water
        setupToggle('water-enabled', 'u_waterEnabled');
        setupControl('water-coverage', 'u_waterCoverage');
        setupControl('water-speed', 'u_waterSpeed');
        setupControl('wave-intensity', 'u_waveIntensity');
        setupControl('water-specular', 'u_waterSpecular');
        setupControl('water-color', 'u_waterColor', true);

        // Ice
        setupToggle('ice-enabled', 'u_iceEnabled');
        setupControl('ice-size', 'u_iceSize');
        setupControl('ice-roughness', 'u_iceRoughness');
        setupControl('ice-color', 'u_iceColor', true);

        // Clouds
        setupToggle('clouds-enabled', 'u_cloudsEnabled');

        // Custom handler for cloud coverage - remap slider [0,1] to effective range [0.5,1.0]
        document.getElementById('cloud-coverage').addEventListener('input', (e) => {
            const sliderValue = parseFloat(e.target.value); // 0.0 to 1.0
            const remappedValue = 0.5 + (sliderValue * 0.5); // Map to 0.5-1.0 range
            material.uniforms.u_cloudCoverage.value = remappedValue;
            const valueDisplay = document.getElementById('cloud-coverage-val');
            if(valueDisplay) {
                valueDisplay.textContent = sliderValue.toFixed(2); // Show original slider value
            }
        });

        setupControl('cloud-speed', 'u_cloudSpeed');
        setupControl('cloud-depth', 'u_cloudDepth');
        setupControl('cloud-shadow', 'u_cloudShadow');

        document.getElementById('cloud-noise-type').addEventListener('change', (e) => {
            material.uniforms.u_cloudNoiseType.value = parseFloat(e.target.value);
        });

        // Atmosphere
        setupToggle('atmosphere-enabled', 'u_atmosphereEnabled');
        setupControl('atmosphere-density', 'u_atmosphereDensity');
        setupControl('atmosphere-color', 'u_atmosphereColor', true);

        // Presets
        window.loadPreset = function(preset) {
            const presets = {
                earth: {
                    terrainScale: 3.0, terrainRoughness: 0.5, biomeVariation: 0.7,
                    mountainColor: '#8b7355', lowlandColor: '#4a7c59', desertColor: '#c19a6b',
                    waterCoverage: 0.6, waterSpeed: 0.3, waveIntensity: 0.4, waterSpecular: 0.8, waterColor: '#1e5a8e',
                    iceSize: 0.25, iceRoughness: 0.3, iceColor: '#e8f4f8',
                    cloudCoverage: 0.5, cloudSpeed: 0.15, cloudNoiseType: 1, cloudDepth: 0.6, cloudShadow: 0.4,
                    atmosphereDensity: 0.5, atmosphereColor: '#87ceeb',
                    terrainEnabled: true, waterEnabled: true, iceEnabled: true, cloudsEnabled: true, atmosphereEnabled: true
                },
                mars: {
                    terrainScale: 4.0, terrainRoughness: 0.7, biomeVariation: 0.3,
                    mountainColor: '#cd5c5c', lowlandColor: '#c44e3f', desertColor: '#d2691e',
                    waterCoverage: 0.0, waterSpeed: 0.0, waveIntensity: 0.0, waterSpecular: 0.0, waterColor: '#000000',
                    iceSize: 0.15, iceRoughness: 0.5, iceColor: '#ffe4e1',
                    cloudCoverage: 0.1, cloudSpeed: 0.05, cloudNoiseType: 0, cloudDepth: 0.2, cloudShadow: 0.1,
                    atmosphereDensity: 0.2, atmosphereColor: '#ffa07a',
                    terrainEnabled: true, waterEnabled: false, iceEnabled: true, cloudsEnabled: true, atmosphereEnabled: true
                },
                ocean: {
                    terrainScale: 2.0, terrainRoughness: 0.3, biomeVariation: 0.4,
                    mountainColor: '#556b2f', lowlandColor: '#6b8e23', desertColor: '#8fbc8f',
                    waterCoverage: 0.85, waterSpeed: 0.5, waveIntensity: 0.6, waterSpecular: 1.0, waterColor: '#006994',
                    iceSize: 0.1, iceRoughness: 0.2, iceColor: '#f0f8ff',
                    cloudCoverage: 0.7, cloudSpeed: 0.25, cloudNoiseType: 1, cloudDepth: 0.8, cloudShadow: 0.5,
                    atmosphereDensity: 0.7, atmosphereColor: '#87ceeb',
                    terrainEnabled: true, waterEnabled: true, iceEnabled: true, cloudsEnabled: true, atmosphereEnabled: true
                },
                frozen: {
                    terrainScale: 3.5, terrainRoughness: 0.6, biomeVariation: 0.2,
                    mountainColor: '#dcdcdc', lowlandColor: '#e6e6fa', desertColor: '#f0f8ff',
                    waterCoverage: 0.3, waterSpeed: 0.1, waveIntensity: 0.2, waterSpecular: 0.5, waterColor: '#4682b4',
                    iceSize: 0.5, iceRoughness: 0.4, iceColor: '#ffffff',
                    cloudCoverage: 0.3, cloudSpeed: 0.1, cloudNoiseType: 0, cloudDepth: 0.4, cloudShadow: 0.2,
                    atmosphereDensity: 0.3, atmosphereColor: '#b0c4de',
                    terrainEnabled: true, waterEnabled: true, iceEnabled: true, cloudsEnabled: true, atmosphereEnabled: true
                },
                desert: {
                    terrainScale: 3.5, terrainRoughness: 0.6, biomeVariation: 0.4,
                    mountainColor: '#8b4513', lowlandColor: '#daa520', desertColor: '#f4a460',
                    waterCoverage: 0.1, waterSpeed: 0.0, waveIntensity: 0.0, waterSpecular: 0.3, waterColor: '#8b7355',
                    iceSize: 0.05, iceRoughness: 0.7, iceColor: '#fffacd',
                    cloudCoverage: 0.2, cloudSpeed: 0.08, cloudNoiseType: 0, cloudDepth: 0.3, cloudShadow: 0.2,
                    atmosphereDensity: 0.3, atmosphereColor: '#daa520',
                    terrainEnabled: true, waterEnabled: true, iceEnabled: false, cloudsEnabled: true, atmosphereEnabled: true
                },
                alien: {
                    terrainScale: 4.5, terrainRoughness: 0.8, biomeVariation: 0.9,
                    mountainColor: '#9370db', lowlandColor: '#20b2aa', desertColor: '#ff6347',
                    waterCoverage: 0.55, waterSpeed: 0.4, waveIntensity: 0.5, waterSpecular: 0.9, waterColor: '#00ced1',
                    iceSize: 0.2, iceRoughness: 0.5, iceColor: '#e0ffff',
                    cloudCoverage: 0.6, cloudSpeed: 0.2, cloudNoiseType: 3, cloudDepth: 0.7, cloudShadow: 0.4,
                    atmosphereDensity: 0.6, atmosphereColor: '#9370db',
                    terrainEnabled: true, waterEnabled: true, iceEnabled: true, cloudsEnabled: true, atmosphereEnabled: true
                }
            };

            const p = presets[preset];
            if(!p) return;

            // Apply all values
            Object.keys(p).forEach(key => {
                const element = document.getElementById(key.replace(/([A-Z])/g, '-$1').toLowerCase());
                if(!element) return;

                if(typeof p[key] === 'boolean') {
                    element.checked = p[key];
                    element.dispatchEvent(new Event('change'));
                } else if(key.includes('Color')) {
                    element.value = p[key];
                    element.dispatchEvent(new Event('input'));
                } else if(key === 'cloudNoiseType') {
                    element.value = p[key].toString();
                    element.dispatchEvent(new Event('change'));
                } else {
                    element.value = p[key];
                    element.dispatchEvent(new Event('input'));
                }
            });
        };

        window.randomizePlanet = function() {
            const rand = (min, max) => Math.random() * (max - min) + min;
            const randColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');

            document.getElementById('terrain-scale').value = rand(2, 6);
            document.getElementById('terrain-scale').dispatchEvent(new Event('input'));

            document.getElementById('biome-variation').value = rand(0.3, 1);
            document.getElementById('biome-variation').dispatchEvent(new Event('input'));

            document.getElementById('water-coverage').value = rand(0, 0.9);
            document.getElementById('water-coverage').dispatchEvent(new Event('input'));

            document.getElementById('cloud-coverage').value = rand(0.2, 0.8);
            document.getElementById('cloud-coverage').dispatchEvent(new Event('input'));

            document.getElementById('cloud-noise-type').value = Math.floor(rand(0, 4)).toString();
            document.getElementById('cloud-noise-type').dispatchEvent(new Event('change'));
        };

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            material.uniforms.u_time.value += 0.016;
            planet.rotation.y += 0.002;

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
