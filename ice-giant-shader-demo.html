<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Giant Shader - Three.js Demo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      overflow: hidden;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #controls {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(20, 20, 20, 0.95);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    h3 {
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      border-bottom: 2px solid #007acc;
      padding-bottom: 10px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #b0b0b0;
      font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #007acc;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #007acc;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    input[type="color"] {
      width: 100%;
      height: 32px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #1a1a1a;
      cursor: pointer;
    }
    .value {
      display: inline-block;
      float: right;
      color: #007acc;
      font-weight: 600;
      font-size: 11px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #005a9e;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h3>Ice Giant Shader Controls</h3>

    <div class="control-group">
      <label>Band Count: <span class="value" id="bandCount-value">8</span></label>
      <input type="range" id="bandCount" min="3" max="15" value="8" step="1">
    </div>

    <div class="control-group">
      <label>Turbulence: <span class="value" id="turbulence-value">0.65</span></label>
      <input type="range" id="turbulence" min="0" max="1" value="0.65" step="0.01">
    </div>

    <div class="control-group">
      <label>Distortion: <span class="value" id="distortion-value">0.15</span></label>
      <input type="range" id="distortion" min="0" max="0.5" value="0.15" step="0.01">
    </div>

    <div class="control-group">
      <label>Ambient Light: <span class="value" id="ambient-value">0.60</span></label>
      <input type="range" id="ambient" min="0" max="1" value="0.60" step="0.01">
    </div>

    <div class="control-group">
      <label>Diffuse Light: <span class="value" id="diffuse-value">0.30</span></label>
      <input type="range" id="diffuse" min="0" max="1" value="0.30" step="0.01">
    </div>

    <div class="control-group">
      <label>Band Color 1 (Light Blue):</label>
      <input type="color" id="color1" value="#6699e6">
    </div>

    <div class="control-group">
      <label>Band Color 2 (Medium Blue):</label>
      <input type="color" id="color2" value="#3366b3">
    </div>

    <div class="control-group">
      <label>Band Color 3 (Pale Cyan):</label>
      <input type="color" id="color3" value="#99ccff">
    </div>

    <button onclick="randomizeSeed()">Randomize Seed</button>
    <button onclick="resetDefaults()">Reset Defaults</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // SIMPLEX NOISE (same as gas giant)
    // ============================================================================
    const noiseGLSL = `
      vec3 mod289(vec3 x) {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 mod289(vec4 x) {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 permute(vec4 x) {
        return mod289(((x * 34.0) + 1.0) * x);
      }

      vec4 taylorInvSqrt(vec4 r) {
        return 1.79284291400159 - 0.85373472095314 * r;
      }

      float simplex3D(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod289(i);
        vec4 p = permute(permute(permute(
          i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }

      float fbm2(vec3 p) {
        float sum = 0.0;
        float amplitude = 0.5;

        sum += simplex3D(p) * amplitude;
        p *= 2.0;
        amplitude *= 0.5;

        sum += simplex3D(p) * amplitude;

        return sum;
      }
    `;

    // Same shader as gas giant, just with default blue colors for ice giants
    const vertexShader = `
      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec2 vUv;

      void main() {
        vPosition = position;
        vNormal = normalize(normalMatrix * normal);
        vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
        vUv = uv;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      ${noiseGLSL}

      uniform vec3 u_bandColor1;
      uniform vec3 u_bandColor2;
      uniform vec3 u_bandColor3;
      uniform float u_bandCount;
      uniform float u_turbulence;
      uniform float u_seed;
      uniform float u_distortionMultiplier;
      uniform float u_ambientLight;
      uniform float u_diffuseLight;

      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec2 vUv;

      void main() {
        vec3 normPos = normalize(vPosition);
        float latitude = normPos.y;

        // === TURBULENCE ===
        vec3 noisePos1 = normPos * 1.5 + vec3(u_seed * 0.0001);
        float largeTurbulence = fbm2(noisePos1);

        vec3 noisePos2 = normPos * 4.0 + vec3(u_seed * 0.0002);
        float mediumTurbulence = simplex3D(noisePos2);

        vec3 flowNoisePos = normPos * vec3(8.0, 1.5, 8.0) + vec3(u_seed * 0.0003);
        float flowDistortion = simplex3D(flowNoisePos);

        float totalTurbulence = largeTurbulence * 0.6 + mediumTurbulence * 0.3 + flowDistortion * 0.5;

        float distortedLatitude = latitude + (totalTurbulence * u_turbulence * u_distortionMultiplier);

        float latitudeNormalized = (distortedLatitude + 1.0) * 0.5;

        float bandPattern = sin(latitudeNormalized * u_bandCount * 3.14159 * 2.0);
        bandPattern = bandPattern * 0.5 + 0.5;

        // === COLOR SELECTION ===
        vec3 finalColor;

        if (bandPattern < 0.5) {
          float t = bandPattern * 2.0;
          finalColor = mix(u_bandColor1, u_bandColor2, t);
        } else {
          float t = (bandPattern - 0.5) * 2.0;
          finalColor = mix(u_bandColor2, u_bandColor3, t);
        }

        // === SMALL-SCALE DETAIL ===
        float microDetail = simplex3D(normPos * 15.0 + vec3(u_seed * 0.2)) * 0.03;
        finalColor += microDetail;

        // === LIGHTING ===
        vec3 lightDir = normalize(vec3(1.0, 0.5, 0.5));
        float diffuse = max(dot(vNormal, lightDir), 0.0);

        float lighting = u_ambientLight + diffuse * u_diffuseLight;
        finalColor *= lighting;

        finalColor = clamp(finalColor, 0.0, 1.0);

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // ============================================================================
    // SCENE SETUP
    // ============================================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    camera.position.z = 3;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
    scene.add(ambientLight);

    // ============================================================================
    // ICE GIANT CREATION
    // ============================================================================
    let currentSeed = 42;

    const uniforms = {
      u_bandColor1: { value: new THREE.Vector3(0.4, 0.6, 0.9) },   // Light blue
      u_bandColor2: { value: new THREE.Vector3(0.2, 0.4, 0.7) },   // Medium blue
      u_bandColor3: { value: new THREE.Vector3(0.6, 0.8, 1.0) },   // Pale cyan
      u_bandCount: { value: 8.0 },
      u_turbulence: { value: 0.65 },
      u_seed: { value: currentSeed },
      u_distortionMultiplier: { value: 0.15 },
      u_ambientLight: { value: 0.6 },
      u_diffuseLight: { value: 0.3 }
    };

    const geometry = new THREE.IcosahedronGeometry(1, 4);
    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms
    });

    const planet = new THREE.Mesh(geometry, material);
    scene.add(planet);

    // ============================================================================
    // UI CONTROLS
    // ============================================================================
    function hexToVec3(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      return new THREE.Vector3(r, g, b);
    }

    document.getElementById('bandCount').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_bandCount.value = value;
      document.getElementById('bandCount-value').textContent = value;
    });

    document.getElementById('turbulence').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_turbulence.value = value;
      document.getElementById('turbulence-value').textContent = value.toFixed(2);
    });

    document.getElementById('distortion').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_distortionMultiplier.value = value;
      document.getElementById('distortion-value').textContent = value.toFixed(2);
    });

    document.getElementById('ambient').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_ambientLight.value = value;
      document.getElementById('ambient-value').textContent = value.toFixed(2);
    });

    document.getElementById('diffuse').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_diffuseLight.value = value;
      document.getElementById('diffuse-value').textContent = value.toFixed(2);
    });

    document.getElementById('color1').addEventListener('input', (e) => {
      uniforms.u_bandColor1.value = hexToVec3(e.target.value);
    });

    document.getElementById('color2').addEventListener('input', (e) => {
      uniforms.u_bandColor2.value = hexToVec3(e.target.value);
    });

    document.getElementById('color3').addEventListener('input', (e) => {
      uniforms.u_bandColor3.value = hexToVec3(e.target.value);
    });

    window.randomizeSeed = () => {
      currentSeed = Math.floor(Math.random() * 100000);
      uniforms.u_seed.value = currentSeed;
    };

    window.resetDefaults = () => {
      uniforms.u_bandColor1.value = new THREE.Vector3(0.4, 0.6, 0.9);
      uniforms.u_bandColor2.value = new THREE.Vector3(0.2, 0.4, 0.7);
      uniforms.u_bandColor3.value = new THREE.Vector3(0.6, 0.8, 1.0);
      uniforms.u_bandCount.value = 8.0;
      uniforms.u_turbulence.value = 0.65;
      uniforms.u_distortionMultiplier.value = 0.15;
      uniforms.u_ambientLight.value = 0.6;
      uniforms.u_diffuseLight.value = 0.3;

      document.getElementById('bandCount').value = 8;
      document.getElementById('turbulence').value = 0.65;
      document.getElementById('distortion').value = 0.15;
      document.getElementById('ambient').value = 0.60;
      document.getElementById('diffuse').value = 0.30;
      document.getElementById('color1').value = '#6699e6';
      document.getElementById('color2').value = '#3366b3';
      document.getElementById('color3').value = '#99ccff';

      document.getElementById('bandCount-value').textContent = '8';
      document.getElementById('turbulence-value').textContent = '0.65';
      document.getElementById('distortion-value').textContent = '0.15';
      document.getElementById('ambient-value').textContent = '0.60';
      document.getElementById('diffuse-value').textContent = '0.30';
    };

    // ============================================================================
    // ANIMATION LOOP
    // ============================================================================
    function animate() {
      requestAnimationFrame(animate);

      planet.rotation.y += 0.001;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
