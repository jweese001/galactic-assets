<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocky Planet Shader - Three.js Demo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      overflow: hidden;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #controls {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(20, 20, 20, 0.95);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    h3 {
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      border-bottom: 2px solid #007acc;
      padding-bottom: 10px;
    }
    h4 {
      margin: 15px 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      border-bottom: 1px solid #007acc;
      padding-bottom: 8px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #b0b0b0;
      font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: #007acc;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #007acc;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    input[type="color"] {
      width: 100%;
      height: 32px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #1a1a1a;
      cursor: pointer;
    }
    .value {
      display: inline-block;
      float: right;
      color: #007acc;
      font-weight: 600;
      font-size: 11px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #005a9e;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h3>Rocky/Barren Planet Shader</h3>

    <h4>Color Multipliers</h4>

    <div class="control-group">
      <label>Dark Regions: <span class="value" id="darkMult-value">0.4</span></label>
      <input type="range" id="darkMult" min="0.1" max="1.0" value="0.4" step="0.05">
    </div>

    <div class="control-group">
      <label>Mid Regions: <span class="value" id="midMult-value">0.8</span></label>
      <input type="range" id="midMult" min="0.3" max="1.5" value="0.8" step="0.05">
    </div>

    <div class="control-group">
      <label>Light Regions: <span class="value" id="lightMult-value">1.2</span></label>
      <input type="range" id="lightMult" min="0.5" max="2.0" value="1.2" step="0.05">
    </div>

    <div class="control-group">
      <label>Bright Regions: <span class="value" id="brightMult-value">1.6</span></label>
      <input type="range" id="brightMult" min="0.8" max="2.5" value="1.6" step="0.1">
    </div>

    <h4>Geological Features</h4>

    <div class="control-group">
      <label>Region Scale: <span class="value" id="regionScale-value">1.5</span></label>
      <input type="range" id="regionScale" min="0.5" max="5.0" value="1.5" step="0.1">
    </div>

    <div class="control-group">
      <label>Crack Scale: <span class="value" id="crackScale-value">8.0</span></label>
      <input type="range" id="crackScale" min="2" max="20" value="8.0" step="0.5">
    </div>

    <div class="control-group">
      <label>Crack Intensity: <span class="value" id="crackIntensity-value">0.4</span></label>
      <input type="range" id="crackIntensity" min="0" max="1" value="0.4" step="0.05">
    </div>

    <div class="control-group">
      <label>Crack Brightness: <span class="value" id="crackBright-value">2.0</span></label>
      <input type="range" id="crackBright" min="1.0" max="3.0" value="2.0" step="0.1">
    </div>

    <div class="control-group">
      <label>Rust Amount: <span class="value" id="rustAmount-value">0.3</span></label>
      <input type="range" id="rustAmount" min="0" max="1" value="0.3" step="0.05">
    </div>

    <div class="control-group">
      <label>Rust Color:</label>
      <input type="color" id="rustColor" value="#994d33">
    </div>

    <h4>Lighting</h4>

    <div class="control-group">
      <label>Ambient: <span class="value" id="ambient-value">0.50</span></label>
      <input type="range" id="ambient" min="0" max="1" value="0.50" step="0.01">
    </div>

    <div class="control-group">
      <label>Diffuse: <span class="value" id="diffuse-value">0.50</span></label>
      <input type="range" id="diffuse" min="0" max="1" value="0.50" step="0.01">
    </div>

    <h4>Base Color</h4>

    <div class="control-group">
      <label>Base Color:</label>
      <input type="color" id="baseColor" value="#696969">
    </div>

    <button onclick="randomizeSeed()">Randomize Seed</button>
    <button onclick="resetDefaults()">Reset Defaults</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // SIMPLEX NOISE
    // ============================================================================
    const noiseGLSL = `
      vec3 mod289(vec3 x) {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 mod289(vec4 x) {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 permute(vec4 x) {
        return mod289(((x * 34.0) + 1.0) * x);
      }

      vec4 taylorInvSqrt(vec4 r) {
        return 1.79284291400159 - 0.85373472095314 * r;
      }

      float simplex3D(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);

        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);

        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;

        i = mod289(i);
        vec4 p = permute(permute(permute(
          i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));

        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;

        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);

        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);

        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);

        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);

        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));

        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);

        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x;
        p1 *= norm.y;
        p2 *= norm.z;
        p3 *= norm.w;

        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }
    `;

    // ============================================================================
    // ROCKY PLANET SHADERS
    // ============================================================================
    const vertexShader = `
      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec2 vUv;

      void main() {
        vPosition = position;
        vNormal = normalize(normalMatrix * normal);
        vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
        vUv = uv;

        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      ${noiseGLSL}

      uniform vec3 u_baseColor;
      uniform float u_seed;
      uniform float u_darkMult;
      uniform float u_midMult;
      uniform float u_lightMult;
      uniform float u_brightMult;
      uniform float u_regionScale;
      uniform float u_crackScale;
      uniform float u_crackIntensity;
      uniform float u_crackBrightness;
      uniform vec3 u_rustColor;
      uniform float u_rustAmount;
      uniform float u_ambientLight;
      uniform float u_diffuseLight;

      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      varying vec2 vUv;

      void main() {
        vec3 normPos = normalize(vPosition);

        // === TERRAIN ELEVATION ===
        vec3 noisePos = normPos * 4.0 + vec3(u_seed * 0.1);
        float terrain = 0.0;
        terrain += 0.5 * simplex3D(noisePos);
        terrain += 0.25 * simplex3D(noisePos * 2.0);
        terrain += 0.125 * simplex3D(noisePos * 4.0);
        terrain = terrain * 0.5 + 0.5;

        // === LARGE-SCALE REGIONAL VARIATION ===
        float regionNoise = simplex3D(normPos * u_regionScale + vec3(u_seed * 0.01));

        // Color palette
        vec3 darkRegion = u_baseColor * u_darkMult;
        vec3 midRegion = u_baseColor * u_midMult;
        vec3 lightRegion = u_baseColor * u_lightMult;
        vec3 brightRegion = u_baseColor * u_brightMult;

        // Rust patches
        float rustBlend = smoothstep(0.3, 0.7, regionNoise) * u_rustAmount;

        // === CRACK/VALLEY FEATURES ===
        float crackNoise = abs(simplex3D(normPos * u_crackScale + vec3(u_seed * 0.02)));
        float cracks = smoothstep(0.85, 0.95, crackNoise);
        vec3 crackColor = u_baseColor * u_crackBrightness;

        // === COMBINE ELEVATION WITH REGIONS ===
        float combinedTerrain = terrain * 0.7 + regionNoise * 0.3;

        vec3 finalColor;
        if (combinedTerrain < 0.3) {
          finalColor = mix(darkRegion, midRegion, combinedTerrain / 0.3);
        } else if (combinedTerrain < 0.6) {
          finalColor = mix(midRegion, lightRegion, (combinedTerrain - 0.3) / 0.3);
        } else {
          finalColor = mix(lightRegion, brightRegion, (combinedTerrain - 0.6) / 0.4);
        }

        // Add rust patches
        finalColor = mix(finalColor, u_rustColor, rustBlend);

        // Add cracks
        finalColor = mix(finalColor, crackColor, cracks * u_crackIntensity);

        // Micro detail
        float microDetail = simplex3D(normPos * 20.0) * 0.06;
        finalColor += microDetail;

        // === LIGHTING ===
        vec3 lightDir = normalize(vec3(1.0, 1.0, 0.5));
        float diffuse = max(dot(vNormal, lightDir), 0.0);

        float lighting = u_ambientLight + diffuse * u_diffuseLight;
        finalColor *= lighting;

        finalColor = clamp(finalColor, 0.0, 1.0);

        gl_FragColor = vec4(finalColor, 1.0);
      }
    `;

    // ============================================================================
    // SCENE SETUP
    // ============================================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    camera.position.z = 3;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
    scene.add(ambientLight);

    // ============================================================================
    // PLANET CREATION
    // ============================================================================
    let currentSeed = 42;

    const uniforms = {
      u_baseColor: { value: new THREE.Vector3(0.412, 0.412, 0.412) },
      u_seed: { value: currentSeed },
      u_darkMult: { value: 0.4 },
      u_midMult: { value: 0.8 },
      u_lightMult: { value: 1.2 },
      u_brightMult: { value: 1.6 },
      u_regionScale: { value: 1.5 },
      u_crackScale: { value: 8.0 },
      u_crackIntensity: { value: 0.4 },
      u_crackBrightness: { value: 2.0 },
      u_rustColor: { value: new THREE.Vector3(0.6, 0.3, 0.2) },
      u_rustAmount: { value: 0.3 },
      u_ambientLight: { value: 0.5 },
      u_diffuseLight: { value: 0.5 }
    };

    const geometry = new THREE.IcosahedronGeometry(1, 4);
    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      uniforms
    });

    const planet = new THREE.Mesh(geometry, material);
    scene.add(planet);

    // ============================================================================
    // UI CONTROLS
    // ============================================================================
    function hexToVec3(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255;
      const g = parseInt(hex.slice(3, 5), 16) / 255;
      const b = parseInt(hex.slice(5, 7), 16) / 255;
      return new THREE.Vector3(r, g, b);
    }

    function vec3ToHex(vec3) {
      const r = Math.round(vec3.x * 255).toString(16).padStart(2, '0');
      const g = Math.round(vec3.y * 255).toString(16).padStart(2, '0');
      const b = Math.round(vec3.z * 255).toString(16).padStart(2, '0');
      return `#${r}${g}${b}`;
    }

    // Color multipliers
    ['darkMult', 'midMult', 'lightMult', 'brightMult'].forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        uniforms[`u_${id}`].value = value;
        document.getElementById(`${id}-value`).textContent = value.toFixed(2);
      });
    });

    // Geological features
    ['regionScale', 'crackScale', 'crackIntensity', 'crackBright'].forEach(id => {
      const uniformName = id === 'crackBright' ? 'u_crackBrightness' : `u_${id}`;
      document.getElementById(id).addEventListener('input', (e) => {
        const value = parseFloat(e.target.value);
        uniforms[uniformName].value = value;
        document.getElementById(`${id}-value`).textContent = value.toFixed(id === 'crackScale' ? 1 : 2);
      });
    });

    // Rust
    document.getElementById('rustAmount').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_rustAmount.value = value;
      document.getElementById('rustAmount-value').textContent = value.toFixed(2);
    });

    document.getElementById('rustColor').addEventListener('input', (e) => {
      uniforms.u_rustColor.value = hexToVec3(e.target.value);
    });

    // Lighting
    document.getElementById('ambient').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_ambientLight.value = value;
      document.getElementById('ambient-value').textContent = value.toFixed(2);
    });

    document.getElementById('diffuse').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      uniforms.u_diffuseLight.value = value;
      document.getElementById('diffuse-value').textContent = value.toFixed(2);
    });

    // Base color
    document.getElementById('baseColor').addEventListener('input', (e) => {
      uniforms.u_baseColor.value = hexToVec3(e.target.value);
    });

    // Randomize seed
    window.randomizeSeed = () => {
      currentSeed = Math.floor(Math.random() * 100000);
      uniforms.u_seed.value = currentSeed;
    };

    // Reset defaults
    window.resetDefaults = () => {
      uniforms.u_baseColor.value = new THREE.Vector3(0.412, 0.412, 0.412);
      uniforms.u_darkMult.value = 0.4;
      uniforms.u_midMult.value = 0.8;
      uniforms.u_lightMult.value = 1.2;
      uniforms.u_brightMult.value = 1.6;
      uniforms.u_regionScale.value = 1.5;
      uniforms.u_crackScale.value = 8.0;
      uniforms.u_crackIntensity.value = 0.4;
      uniforms.u_crackBrightness.value = 2.0;
      uniforms.u_rustColor.value = new THREE.Vector3(0.6, 0.3, 0.2);
      uniforms.u_rustAmount.value = 0.3;
      uniforms.u_ambientLight.value = 0.5;
      uniforms.u_diffuseLight.value = 0.5;

      // Update UI
      document.getElementById('darkMult').value = 0.4;
      document.getElementById('midMult').value = 0.8;
      document.getElementById('lightMult').value = 1.2;
      document.getElementById('brightMult').value = 1.6;
      document.getElementById('regionScale').value = 1.5;
      document.getElementById('crackScale').value = 8.0;
      document.getElementById('crackIntensity').value = 0.4;
      document.getElementById('crackBright').value = 2.0;
      document.getElementById('rustAmount').value = 0.3;
      document.getElementById('rustColor').value = '#994d33';
      document.getElementById('ambient').value = 0.50;
      document.getElementById('diffuse').value = 0.50;
      document.getElementById('baseColor').value = '#696969';

      // Update value displays
      document.getElementById('darkMult-value').textContent = '0.4';
      document.getElementById('midMult-value').textContent = '0.8';
      document.getElementById('lightMult-value').textContent = '1.2';
      document.getElementById('brightMult-value').textContent = '1.6';
      document.getElementById('regionScale-value').textContent = '1.5';
      document.getElementById('crackScale-value').textContent = '8.0';
      document.getElementById('crackIntensity-value').textContent = '0.4';
      document.getElementById('crackBright-value').textContent = '2.0';
      document.getElementById('rustAmount-value').textContent = '0.3';
      document.getElementById('ambient-value').textContent = '0.50';
      document.getElementById('diffuse-value').textContent = '0.50';
    };

    // ============================================================================
    // ANIMATION LOOP
    // ============================================================================
    function animate() {
      requestAnimationFrame(animate);

      planet.rotation.y += 0.001;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
